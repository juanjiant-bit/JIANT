<!-- JIANT Studio: one page for JIANT FM and JIANT BYTE on the M-VAVE FM-1. Install, edit, the FM-1's screen big,
     the emulator, recording. The tools are the sites' own pages (both on juanjiant-bit.github.io: one origin), shown
     here in frames and dressed in the firmware's look; one USB link for the screen and the device check. studio.js.
     ?mock=1: a simulated FM-1 (no hardware). ?fw=fm|byte, ?view=home|install|editor|screen|emu|rec, ?screen: straight to
     the screen. -->
<html lang="es" data-skin="fm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050409">
<title>JIANT Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Silkscreen&amp;family=VT323&amp;display=swap">
<style>
  /* ---- the two looks: JIANT FM (the landing page's: cream on near-black, the heat gradient, Michroma, a horizon of
     lines) and JIANT BYTE (its screens': black, stars, violet and orange, pixel type, synthwave stripes) ---- */
  :root, :root[data-skin="fm"] {
    --bg: #050409; --panel: #0d0b14; --field: #08070e; --fg: #efe6c8; --dim: #a39bb6; --line: rgba(239,230,200,.18);
    --accent: #c9a2ff; --accent-2: #ff9a8a; --ok: #7be0a8; --warn: #ffc07a; --bad: #ff6b6b; --on-accent: #050409;
    --frame: #3fe0e6;
    --heat: linear-gradient(90deg, #3b6cff, #9d6bff 25%, #ff4a7a 50%, #ff8a1f 75%, #ffe14d);
    --display: "Michroma", "Arial Black", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --radius: 14px; --radius-s: 9px; --border: 1px;
  }
  :root[data-skin="byte"] {
    --bg: #000; --panel: #0b0912; --field: #05040a; --fg: #f2f0f7; --dim: #9d94b8; --line: rgba(167,123,255,.35);
    --accent: #a77bff; --accent-2: #ff7a1a; --ok: #6bff9e; --warn: #ffb21a; --bad: #ff3b3b; --on-accent: #000;
    --frame: #a77bff;
    --heat: linear-gradient(90deg, #ff3b3b, #ff7a1a 40%, #ffb21a 60%, #a77bff);
    --display: "Silkscreen", "VT323", ui-monospace, monospace;
    --body: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --mono: "VT323", "IBM Plex Mono", ui-monospace, monospace;
    --radius: 3px; --radius-s: 2px; --border: 2px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
  a { color: inherit; }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* backdrops: FM's horizon grid; BYTE's stars and stripes (both behind everything, never under the frames' clicks) */
  .backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  :root[data-skin="fm"] .backdrop::after { content: ""; position: absolute; left: -50%; right: -50%; bottom: 0; height: 42vh;
    background: repeating-linear-gradient(90deg, rgba(157,107,255,.16) 0 1px, transparent 1px 64px),
                repeating-linear-gradient(0deg, rgba(157,107,255,.14) 0 1px, transparent 1px 32px);
    transform: perspective(380px) rotateX(62deg); transform-origin: bottom; mask-image: linear-gradient(to top, #000, transparent); }
  :root[data-skin="byte"] .backdrop { background:
      radial-gradient(1px 1px at 12% 18%, #fff8, transparent), radial-gradient(1px 1px at 72% 12%, #fff6, transparent),
      radial-gradient(1px 1px at 33% 64%, #fff5, transparent), radial-gradient(1px 1px at 86% 48%, #fff7, transparent),
      radial-gradient(1px 1px at 52% 31%, #fff4, transparent), radial-gradient(1px 1px at 8% 82%, #fff6, transparent),
      radial-gradient(1px 1px at 91% 86%, #fff5, transparent), radial-gradient(1px 1px at 64% 77%, #fff4, transparent);
    background-size: 340px 340px; }

  /* ---- top bar: the wordmark, the views, the firmware and the target, the device ---- */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: var(--border) solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; font: 18px/1 var(--display); letter-spacing: .04em; }
  .brand .fw { background: var(--heat); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand small { font: 11px/1 var(--mono); color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
  :root[data-skin="byte"] .brand { font-size: 20px; }
  nav.views { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
  nav.views::-webkit-scrollbar { display: none; }
  nav.views button { background: none; border: var(--border) solid transparent; border-radius: var(--radius-s); padding: 7px 12px;
    cursor: pointer; color: var(--dim); white-space: nowrap; font-size: 14px; }
  nav.views button[aria-current="page"] { color: var(--fg); border-color: var(--line); background: var(--panel); }
  :root[data-skin="byte"] nav.views button { font-family: var(--display); font-size: 11px; text-transform: uppercase; padding: 7px 9px; }
  :root[data-skin="byte"] nav.views button[aria-current="page"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: var(--border) solid var(--line); border-radius: var(--radius-s); overflow: hidden; }
  .seg button { background: none; border: 0; padding: 6px 10px; cursor: pointer; color: var(--dim); font-size: 13px; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .chip { display: inline-flex; align-items: center; gap: 7px; font: 12px/1 var(--mono); color: var(--dim); padding: 6px 10px;
    border: var(--border) solid var(--line); border-radius: 999px; white-space: nowrap; }
  :root[data-skin="byte"] .chip { border-radius: var(--radius-s); font-size: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .lang { background: none; border: 0; color: var(--dim); cursor: pointer; text-decoration: underline; font-size: 13px; }

  /* ---- views ---- */
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .view { animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }
  .eyebrow { font: 12px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--frame); margin: 0 0 8px; }
  :root[data-skin="byte"] .eyebrow { font-size: 17px; letter-spacing: .08em; }
  h1 { font: 400 clamp(34px, 7vw, 64px)/1.02 var(--display); margin: 0 0 14px; letter-spacing: .01em; }
  h1 .fw { background: var(--heat); -webkit-background-clip: text; background-clip: text; color: transparent; }
  :root[data-skin="byte"] h1 { text-shadow: 0 0 0 transparent; }
  .rule { height: 3px; border-radius: 3px; background: var(--heat); margin: 18px 0 22px; max-width: 520px; }
  :root[data-skin="byte"] .rule { height: 6px; border-radius: 0; box-shadow: 0 8px 0 -2px #ff7a1a55, 0 16px 0 -4px #a77bff44; margin-bottom: 34px; }
  h2 { font: 500 18px/1.3 var(--body); margin: 0 0 6px; }
  :root[data-skin="byte"] h2 { font: 14px/1.4 var(--display); text-transform: uppercase; letter-spacing: .04em; }
  .lead { font-size: 17px; color: var(--dim); max-width: 640px; margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 26px; }
  .dim { color: var(--dim); }
  .small { font-size: 13px; }

  .card { background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius); padding: 20px; position: relative; }
  :root[data-skin="byte"] .card { box-shadow: 4px 4px 0 #a77bff22; }
  .steps { display: grid; gap: 14px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; }
  .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 14px/1 var(--mono);
    border: var(--border) solid var(--line); color: var(--dim); }
  .step.now .num { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  :root[data-skin="byte"] .num { border-radius: var(--radius-s); font: 13px/1 var(--display); }
  .step p { margin: 0 0 12px; color: var(--dim); }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 9px 18px; border-radius: var(--radius-s);
    border: var(--border) solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; font-weight: 600; text-decoration: none; }
  .btn.ghost { background: none; color: var(--fg); border-color: var(--line); font-weight: 500; }
  .btn:disabled { opacity: .45; cursor: default; }
  :root[data-skin="byte"] .btn { font: 12px/1 var(--display); text-transform: uppercase; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  :root[data-skin="byte"] .btn.ghost { background: none; color: var(--fg); border-color: var(--line); }
  .result { margin-top: 12px; font: 14px/1.5 var(--mono); }
  :root[data-skin="byte"] .result { font-size: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .fwcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .fwcard { border-radius: var(--radius); padding: 18px; border: 1px solid rgba(239,230,200,.18); cursor: pointer; text-align: left;
    color: #efe6c8; background: #0d0b14; position: relative; overflow: hidden; min-height: 150px; }
  .fwcard h3 { margin: 0 0 6px; font: 400 22px/1.1 "Michroma", sans-serif; }
  .fwcard p { margin: 0; color: #a39bb6; font: 14px/1.45 "Instrument Sans", sans-serif; }
  .fwcard .tag { position: absolute; top: 14px; right: 14px; font: 11px/1 "IBM Plex Mono", monospace; letter-spacing: .1em; color: #3fe0e6; }
  .fwcard.fm h3 { background: linear-gradient(90deg, #efe6c8 40%, #c9a2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .fwcard.fm::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 14px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #3b6cff, #9d6bff 25%, #ff4a7a 50%, #ff8a1f 75%, #ffe14d); }
  .fwcard.byte { background: #000; border: 2px solid #a77bff; border-radius: 3px; color: #f2f0f7; }
  .fwcard.byte h3 { font: 24px/1.1 "Silkscreen", monospace; color: #ff7a1a; text-shadow: 3px 3px 0 #ff3b3b66; }
  .fwcard.byte p { font: 14px/1.45 "IBM Plex Mono", monospace; color: #9d94b8; }
  .fwcard.byte .tag { color: #a77bff; font-family: "VT323", monospace; font-size: 16px; }
  .fwcard.byte::after { content: ""; position: absolute; left: 0; right: 0; bottom: 12px; height: 4px;
    background: linear-gradient(90deg, #ff3b3b, #ff7a1a, #a77bff); box-shadow: 0 -8px 0 #ff7a1a44; }
  .fwcard[aria-pressed="true"] { outline: 2px solid var(--frame); outline-offset: 3px; }

  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .tool { text-align: left; background: var(--field); border: var(--border) solid var(--line); border-radius: var(--radius-s); padding: 14px;
    cursor: pointer; }
  .tool b { display: block; margin-bottom: 4px; }
  :root[data-skin="byte"] .tool b { font: 12px/1.3 var(--display); text-transform: uppercase; color: var(--accent); }
  .tool span { color: var(--dim); font-size: 13px; }

  details.help { border-top: var(--border) solid var(--line); padding: 14px 0; }
  details.help:last-of-type { border-bottom: var(--border) solid var(--line); }
  details.help summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  details.help summary::after { content: "+"; color: var(--dim); }
  details.help[open] summary::after { content: "–"; }
  details.help p { color: var(--dim); margin: 10px 0 0; max-width: 760px; }

  .note { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent); padding: 10px 14px;
    border-radius: 0 var(--radius-s) var(--radius-s) 0; margin: 0 0 14px; font-size: 14px; }
  .note.safe { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }

  /* the tools in frames: as tall as the window below the bar */
  .framebox { border: var(--border) solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--field); }
  .framebox iframe { display: block; width: 100%; height: calc(100vh - 210px); min-height: 520px; border: 0; background: var(--bg); }
  .viewhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; margin-bottom: 14px; }
  .viewhead h1 { font-size: clamp(24px, 4vw, 34px); margin: 0; }

  /* ---- the screen: square, as big as fits; portrait: on top, the rest below; landscape: the height, the rest beside ---- */
  .screen-wrap { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .stage { position: relative; background: #000; border-radius: var(--radius); border: var(--border) solid var(--line);
    display: grid; place-items: center; aspect-ratio: 1; width: min(100%, calc(100vh - 270px)); margin: 0 auto; overflow: hidden; }
  .stage canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .stage.smooth canvas { image-rendering: auto; }
  .stage .wait { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #aaa; font: 14px/1.5 var(--mono); }
  .side { display: grid; gap: 10px; align-content: start; }
  @media (orientation: landscape) and (min-width: 700px) {
    .screen-wrap { grid-template-columns: minmax(0, auto) minmax(240px, 320px); justify-content: center; }
    .stage { width: min(calc(100vw - 400px), calc(100vh - 270px)); }
  }
  /* full screen: only the picture, square, centred; the bar fades and comes back on a touch */
  .stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; border-radius: 0; background: #000; }
  .stage:fullscreen canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); }
  .stage .fsbar { position: absolute; top: 0; left: 0; right: 0; display: none; justify-content: flex-end; gap: 8px; padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top)); transition: opacity .4s; }
  .stage:fullscreen .fsbar { display: flex; }
  .stage .fsbar.faded { opacity: 0; }
  .stage .fsbar button { background: #000a; color: #eee; border: 1px solid #fff4; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .stat { font: 13px/1.4 var(--mono); color: var(--dim); }
  :root[data-skin="byte"] .stat { font-size: 17px; }

  /* other devices: a card each (its picture or its outline, state, what it is, the links) */
  .ports { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .port { display: flex; flex-direction: column; gap: 10px; }
  .port .pic { aspect-ratio: 16 / 9; border-radius: var(--radius-s); border: var(--border) solid var(--line); background: var(--field);
    display: grid; place-items: center; overflow: hidden; }
  .port .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .port .pic svg { width: 78%; height: auto; color: var(--dim); }
  .port .pic .picopen { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
  .port .pic .picopen:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .port .thumbs { display: flex; gap: 6px; }
  .port .thumbs button { all: unset; cursor: pointer; width: 64px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; border: var(--border) solid var(--line); opacity: .6; }
  .port .thumbs button[aria-pressed="true"] { opacity: 1; border-color: var(--accent); }
  .port .thumbs img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .shotdlg { max-width: min(1200px, 96vw); max-height: 96vh; padding: 12px; border: var(--border) solid var(--line); border-radius: var(--radius); background: var(--panel, var(--field)); color: var(--fg); }
  .shotdlg::backdrop { background: rgba(0, 0, 0, .78); }
  .shotdlg img { display: block; max-width: 100%; max-height: calc(96vh - 90px); margin: 0 auto; border-radius: var(--radius-s); }
  .shotbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .shotbar p { flex: 1; margin: 0; color: var(--dim); font-size: 13px; }
  .port h2 { margin: 0; }
  /* projects: the four slots, the backups as rows (name, when, firmware, what it holds, its actions) */
  .projstat { min-height: 1.4em; margin: 0 0 10px; color: var(--dim); font-family: var(--mono, monospace); font-size: 13px; }
  .bkprog { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; margin: 0 0 14px; }
  .bkprog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #v-proj .card { margin-bottom: 16px; }
  #v-proj .card h2 { margin: 0 0 4px; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
  .slot { border: var(--border) solid var(--line); border-radius: var(--radius-s); padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--field); }
  .slot b { font-family: var(--display, inherit); font-size: 28px; line-height: 1; }
  .slot .st { font-family: var(--mono, monospace); font-size: 12px; color: var(--dim); }
  .slot.used .st { color: var(--accent); }
  .slot .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .slot .btn, .bkrow .btn { min-height: 34px; padding: 6px 11px; font-size: 13px; }
  .bklist { display: flex; flex-direction: column; gap: 8px; }
  .bkrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; border: var(--border) solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; background: var(--field); }
  .bkrow input { width: 100%; background: transparent; border: 0; border-bottom: var(--border) dashed var(--line); color: var(--fg); font: inherit; font-weight: 600; padding: 2px 0; }
  .bkrow .when { font-family: var(--mono, monospace); font-size: 12px; color: var(--dim); }
  .bkrow .what { font-size: 13px; color: var(--dim); }
  .bkrow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 720px) { .bkrow { grid-template-columns: minmax(0, 1fr); } .bkrow .acts { justify-content: flex-start; } }
  .bkempty { color: var(--dim); font-size: 14px; padding: 6px 0; }
  .chk { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--dim); }
  /* how it works: sectors, the items, one card with its animation */
  .lrsec { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .lrsec button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; border: var(--border) solid var(--line); font-size: 14px; color: var(--dim); }
  .lrsec button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .lrsec button b { font-weight: 500; opacity: .7; margin-left: 6px; font-size: 12px; }
  .lrlead { margin: 0 0 14px; max-width: 70ch; }
  .lrbody { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .lritems { display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow: auto; position: sticky; top: 12px; }
  .lritems button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: var(--radius-s); border: var(--border) solid transparent; }
  .lritems button b { font-family: var(--display); font-weight: 400; font-size: 14px; letter-spacing: .02em; }
  .lritems button span { font-size: 12px; color: var(--dim); }
  .lritems button:hover { border-color: var(--line); }
  .lritems button[aria-selected="true"] { border-color: var(--accent); background: var(--field); }
  .lrcard { display: flex; flex-direction: column; gap: 12px; }
  .lrstage { aspect-ratio: 16 / 8; border-radius: var(--radius-s); background: var(--field); border: var(--border) solid var(--line); overflow: hidden; }
  .lrstage canvas { width: 100%; height: 100%; display: block; }
  .lrhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .lrhead h2 { margin: 0; font-size: clamp(22px, 3vw, 32px); }
  .lrtag { font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .lrstate { margin: 0; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.5; max-width: 62ch; }
  .lrhow { margin: 0; padding-left: 20px; color: var(--dim); }
  .lrhow li { margin: 4px 0; max-width: 70ch; }
  .lrwhere { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--fg); background: var(--field); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 var(--radius-s) var(--radius-s) 0; }
  .lrnav { justify-content: space-between; }
  .lrlive .row { margin-bottom: 14px; }
  .lvbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .lvbody { grid-template-columns: minmax(0, 1fr); } }
  .lvcard { display: flex; flex-direction: column; gap: 10px; }
  .lvcard h2 { margin: 0; font-size: clamp(30px, 5vw, 52px); }
  .lvline { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--accent); }
  .lvval { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .lvmeter { height: 10px; border-radius: 5px; background: var(--field); border: var(--border) solid var(--line); overflow: hidden; }
  .lvmeter i { display: block; height: 100%; width: 0; background: var(--heat); transition: width .08s; }
  .lvval b { font-family: var(--mono); font-size: 20px; min-width: 70px; text-align: right; }
  .lvhow { margin: 0; color: var(--dim); max-width: 64ch; }
  .lvlog { margin: 0; padding: 0 0 0 4px; list-style: none; font-size: 13px; color: var(--dim); max-height: 60vh; overflow: auto; }
  .lvlog li { margin: 4px 0; }
  .lvlog b { color: var(--fg); font-family: var(--mono); }
  .lrisec { margin: 0 0 22px; }
  .lrisec h2 { margin: 0 0 4px; }
  .lrisec p { margin: 0 0 10px; max-width: 70ch; }
  .lrigrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 10px; }
  .lritile { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 3px; padding: 8px; border-radius: var(--radius-s); border: var(--border) solid var(--line); background: var(--panel); }
  .lritile:hover, .lritile:focus-visible { border-color: var(--accent); }
  .lritile canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: var(--radius-s); background: var(--field); margin-bottom: 4px; }
  .lritile b { font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: .02em; }
  .lritile span { font-size: 12px; color: var(--dim); }
  @media (max-width: 820px) {
    .lrbody { grid-template-columns: minmax(0, 1fr); }
    .lritems { flex-direction: row; overflow-x: auto; max-height: none; position: static; padding-bottom: 4px; }
    .lritems button { flex: none; max-width: 200px; }
    .lrstage { aspect-ratio: 4 / 3; }
  }
  /* rescue: numbered steps (done: ticked), the board's wiring drawn, the LED's colours */
  .badge.warn { font-family: var(--mono, monospace); font-size: 12px; padding: 6px 10px; border-radius: 999px; border: var(--border) solid var(--accent); color: var(--accent); white-space: nowrap; }
  .rsfirst { border-color: var(--accent); margin-bottom: 16px; }
  .rsfirst p { margin: 6px 0 10px; color: var(--dim); }
  .rsteps { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 14px; }
  .rstep h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .rstep .num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 15px; flex: none; }
  .rstep.done .num { background: var(--field); color: var(--accent); border: var(--border) solid var(--accent); }
  .rstep .need, .rstep .sub { margin: 0; padding-left: 20px; color: var(--fg); }
  .rstep .need li, .rstep .sub li { margin: 5px 0; }
  .rstep h3 { margin: 16px 0 8px; font-size: 15px; }
  .seg { display: inline-flex; flex-wrap: wrap; border: var(--border) solid var(--line); border-radius: var(--radius-s); overflow: hidden; margin-bottom: 12px; }
  .seg button { all: unset; cursor: pointer; padding: 9px 14px; font-size: 14px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .wiring { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: center; }
  @media (max-width: 760px) { .wiring { grid-template-columns: minmax(0, 1fr); } }
  .wire svg { width: 100%; height: auto; display: block; }
  .rsst { margin: 8px 0 0; font-family: var(--mono, monospace); font-size: 13px; color: var(--dim); }
  .rsst.ok { color: var(--accent); }
  .rsst.err { color: var(--fg); background: var(--field); border-left: 3px solid var(--accent); padding: 6px 10px; }
  .leds { display: grid; gap: 8px; }
  .led { display: grid; grid-template-columns: 22px minmax(0, 180px) minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
  @media (max-width: 600px) { .led { grid-template-columns: 22px minmax(0, 1fr); } .led span:last-child { grid-column: 2; color: var(--dim); } }
  .led i { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: 0 0 10px var(--c); background: var(--c); }
  .led i.blink { animation: rsblink 1s steps(2, start) infinite; }
  .led i.fast { animation: rsblink .3s steps(2, start) infinite; }
  .led i.alt { animation: rsalt .8s steps(2, start) infinite; }
  @keyframes rsblink { to { opacity: .15; } }
  @keyframes rsalt { 50% { background: var(--c2); box-shadow: 0 0 10px var(--c2); } }
  @media (prefers-reduced-motion: reduce) { .led i { animation: none !important; } }
  .led b { font-weight: 600; }
  /* the manuals: a card each (the interactive manual first and wide), a cheat sheet's picture opens large */
  .docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
  .doc { display: flex; flex-direction: column; gap: 10px; }
  .doc.wide { grid-column: 1 / -1; }
  .doc .pic { aspect-ratio: 16 / 9; border-radius: var(--radius-s); border: var(--border) solid var(--line); background: var(--field); overflow: hidden; }
  .doc.wide .pic { aspect-ratio: 23 / 10; max-height: 460px; width: 100%; }
  .doc.wide .pic img { object-fit: contain; }
  .doc .pic button { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
  .doc .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .doc .pic.glyph { display: grid; place-items: center; padding: 0 16px; text-align: center; font-family: var(--display, inherit); font-size: clamp(16px, 2.4vw, 26px); color: var(--dim); letter-spacing: .04em; }
  .doc.wide .pic.glyph { aspect-ratio: 5 / 1; }
  .doc h2 { margin: 0; }
  .doc p { margin: 0; color: var(--dim); font-size: 14px; }
  .doc .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
  .doc .links .btn { min-height: 36px; padding: 7px 12px; font-size: 13px; }
  .doc .soon { font-family: var(--mono, monospace); font-size: 12px; color: var(--dim); border: var(--border) dashed var(--line); border-radius: var(--radius-s); padding: 7px 12px; }
  .port .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .state { font: 12px/1 var(--mono); padding: 5px 8px; border-radius: 999px; border: var(--border) solid var(--line); color: var(--dim); }
  .state.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
  .state.soon { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  :root[data-skin="byte"] .state { border-radius: var(--radius-s); font-size: 16px; }
  .port p { margin: 0; color: var(--dim); font-size: 14px; }
  .port ul { margin: 0; padding-left: 18px; color: var(--dim); font-size: 13px; }
  .port .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
  .port .links .btn { min-height: 36px; padding: 7px 12px; font-size: 13px; }
  .port .links .na { opacity: .5; pointer-events: none; }
  .emuctl { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  /* the emulator full screen: the browser's own where it has one, else the frame over the whole page (iPhone) */
  #emubox { position: relative; }
  #emubox .emuexit { display: none; position: absolute; bottom: 10px; right: 10px; z-index: 2; opacity: .85; }
  #emubox.max { position: fixed; inset: 0; z-index: 100; border: 0; border-radius: 0; background: var(--bg); }
  #emubox.max .emuexit, #emubox:fullscreen .emuexit { display: inline-flex; }
  #emubox.max iframe, #emubox:fullscreen iframe { height: 100%; min-height: 0; }
  .devtry iframe { height: calc(100vh - 220px); }

  /* recording: the source, the transport, the lanes as a DAW's */
  .srcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 14px 0; }
  .daw { position: relative; display: grid; gap: 6px; }
  .lane { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px; align-items: stretch; --lc: var(--accent); }
  .lane.off { opacity: .35; }
  .lhead { background: var(--field); border: var(--border) solid var(--line); border-left: 4px solid var(--lc); border-radius: var(--radius-s);
    padding: 6px 8px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "n b" "s b" "m m"; gap: 2px 6px; align-content: center; }
  .lname { grid-area: n; font: 600 13px/1.2 var(--mono); color: var(--lc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :root[data-skin="byte"] .lname { font: 18px/1 var(--mono); }
  .lsub { grid-area: s; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lbtns { grid-area: b; display: flex; gap: 4px; align-items: center; }
  .lbtns button { width: 26px; height: 26px; padding: 0; border-radius: 6px; border: var(--border) solid var(--line); background: var(--panel); color: var(--dim);
    font: 600 11px/1 var(--mono); cursor: pointer; }
  .lbtns button[aria-pressed="true"]:first-child { background: var(--warn); color: #000; border-color: var(--warn); }
  .lbtns button[aria-pressed="true"]:last-child { background: var(--ok); color: #000; border-color: var(--ok); }
  .lmeter { grid-area: m; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; margin-top: 4px; }
  .lmeter i { display: block; height: 100%; width: 0; background: var(--lc); transition: width .08s linear; }
  .lwave { width: 100%; height: 56px; display: block; background: var(--field); border: var(--border) solid var(--line); border-radius: var(--radius-s); }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); pointer-events: none; box-shadow: 0 0 8px var(--fg); }
  #recgo.recording { background: var(--bad); border-color: var(--bad); color: #fff; }
  @media (max-width: 640px) { .lane { grid-template-columns: 104px minmax(0, 1fr); } .lsub { display: none; } }
  /* recording */
  .meter { height: 10px; border-radius: 5px; background: var(--field); border: var(--border) solid var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--heat); transition: width .08s linear; }
  .clock { font: 32px/1 var(--mono); letter-spacing: .04em; }
  #recgo.recording { background: var(--bad); border-color: var(--bad); color: #fff; }
  #recgo.recording::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { #recgo.recording::before { animation: none; } }
  :root[data-skin="byte"] .clock { font-size: 42px; color: var(--accent-2); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  label.field { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
  label.field select { background: var(--field); border: var(--border) solid var(--line); border-radius: var(--radius-s); padding: 9px 10px; color: var(--fg); }
  .takes { display: grid; gap: 8px; margin-top: 12px; }
  .take { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; background: var(--field);
    border: var(--border) solid var(--line); border-radius: var(--radius-s); font-size: 14px; }
  .take .name { flex: 1 1 160px; font-family: var(--mono); }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; color: var(--dim); font-size: 12px; }
  @media (max-height: 520px) { header.top { position: static; } }   /* (a phone held sideways: the screen gets the height) */
  @media (max-width: 640px) {
    .bar { gap: 8px 10px; }
    nav.views { order: 3; flex-basis: 100%; }
    .card { padding: 16px; }
    .framebox iframe { height: calc(100vh - 240px); }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<header class="top">
  <div class="bar">
    <a class="brand" href="#home" data-go="home" aria-label="JIANT Studio">JIANT <span class="fw" id="brandfw">FM</span> <small>studio</small></a>
    <nav class="views" aria-label="Studio">
      <button data-go="home" data-t="vHome"></button>
      <button data-go="install" data-t="vInstall"></button>
      <button data-go="editor" data-t="vEditor"></button>
      <button data-go="screen" data-t="vScreen"></button>
      <button data-go="emu" data-t="vEmu"></button>
      <button data-go="rec" data-t="vRec"></button>
      <button data-go="proj" data-t="vProj"></button>
      <button data-go="learn" data-t="vLearn"></button>
      <button data-go="docs" data-t="vDocs"></button>
      <button data-go="rescue" data-t="vRescue"></button>
      <button data-go="ports" data-t="vPorts"></button>
    </nav>
    <div class="controls">
      <span class="seg" role="group" aria-label="Firmware" id="fwseg">
        <button data-fw="fm" aria-pressed="true">FM</button><button data-fw="byte" aria-pressed="false">BYTE</button>
      </span>
      <span class="seg" role="group" id="targetseg" data-t-label="target">
        <button data-target="fm1" aria-pressed="true" data-t="tFm1"></button><button data-target="emu" aria-pressed="false" data-t="tEmu"></button>
      </span>
      <span class="chip" id="devchip" role="status"><span class="dot" id="devdot"></span><span id="devtext"></span></span>
      <button class="lang" id="lang"></button>
    </div>
  </div>
</header>

<main>
  <!-- ======================================================================================= home -->
  <section class="view" id="v-home">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1>JIANT <span class="fw" id="herofw">FM</span></h1>
    <p class="lead" id="herolead"></p>
    <div class="chips"><span class="chip" data-t="needBrowser"></span><span class="chip" data-t="needCable"></span><span class="chip" data-t="needPhone"></span></div>
    <p><a class="btn ghost" id="sitelink" href="../"></a></p>
    <div class="steps">
      <div class="card step now" id="step1">
        <div class="num">1</div>
        <div>
          <h2 data-t="s1Title"></h2>
          <p data-t="s1Text"></p>
          <div class="row"><button class="btn" id="find" data-t="find"></button><button class="btn ghost" id="forget" data-t="forget" hidden></button></div>
          <div class="result" id="findres" role="status" aria-live="polite"></div>
        </div>
      </div>
      <div class="card step" id="step2">
        <div class="num">2</div>
        <div>
          <h2 data-t="s2Title"></h2>
          <p data-t="s2Text"></p>
          <div class="fwcards">
            <button class="fwcard fm" data-install="fm" aria-pressed="false"><span class="tag">FM-1</span><h3>JIANT FM</h3><p data-t="fmPitch"></p></button>
            <button class="fwcard byte" data-install="byte" aria-pressed="false"><span class="tag">FM-1</span><h3>JIANT BYTE</h3><p data-t="bytePitch"></p></button>
          </div>
        </div>
      </div>
      <div class="card step" id="step3">
        <div class="num">3</div>
        <div>
          <h2 data-t="s3Title"></h2>
          <p data-t="s3Text"></p>
          <div class="tools">
            <button class="tool" data-go="editor"><b data-t="vEditor"></b><span data-t="toolEditor"></span></button>
            <button class="tool" data-go="screen"><b data-t="vScreen"></b><span data-t="toolScreen"></span></button>
            <button class="tool" data-go="emu"><b data-t="vEmu"></b><span data-t="toolEmu"></span></button>
            <button class="tool" data-go="rec"><b data-t="vRec"></b><span data-t="toolRec"></span></button>
          </div>
        </div>
      </div>
    </div>
    <div style="margin-top: 28px">
      <details class="help"><summary data-t="hSafeQ"></summary><p data-t="hSafeA"></p></details>
      <details class="help"><summary data-t="hStopQ"></summary><p data-t="hStopA"></p></details>
      <details class="help"><summary data-t="hDeadQ"></summary><p data-t="hDeadA"></p></details>
      <details class="help"><summary data-t="hPhoneQ"></summary><p data-t="hPhoneA"></p></details>
    </div>
  </section>

  <!-- ======================================================================================= install -->
  <section class="view" id="v-install" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vInstall"></p><h1 id="insttitle"></h1></div>
      <span class="seg" role="group" aria-label="Firmware"><button data-fw="fm" aria-pressed="true">JIANT FM</button><button data-fw="byte" aria-pressed="false">JIANT BYTE</button></span></div>
    <p class="note safe" data-t="instSafe"></p>
    <div class="framebox"><iframe id="f-install" title="Installer" loading="lazy"></iframe></div>
  </section>

  <!-- ======================================================================================= editor -->
  <section class="view" id="v-editor" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vEditor"></p><h1 id="edtitle"></h1></div><span class="stat" id="edtarget"></span></div>
    <p class="note" id="ednote" hidden></p>
    <div class="framebox"><iframe id="f-editor" title="Editor" loading="lazy"></iframe></div>
  </section>

  <!-- ======================================================================================= screen -->
  <section class="view" id="v-screen" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vScreen"></p><h1 data-t="scrTitle"></h1></div></div>
    <div class="screen-wrap">
      <div class="stage" id="stage">
        <canvas id="scr" width="240" height="240" aria-label=""></canvas>
        <div class="wait" id="scrwait"></div>
        <div class="fsbar" id="fsbar"><button id="fssharp" data-t="scrSharp"></button><button id="fsexit" data-t="scrExitFull"></button></div>
      </div>
      <div class="side">
        <div class="card">
          <div class="row" style="margin-bottom:10px">
            <button class="btn" id="scrgo" data-t="scrStart"></button>
            <button class="btn ghost" id="scrfull" data-t="scrFull"></button>
          </div>
          <div class="row"><button class="btn ghost" id="scrsharp" aria-pressed="true" data-t="scrSharp"></button></div>
          <p class="stat" id="scrstat" role="status" aria-live="polite"></p>
          <p class="small dim" id="scrhelp"></p>
        </div>
        <div class="card small dim" data-t="scrOrient"></div>
      </div>
    </div>
  </section>

  <!-- ======================================================================================= ports -->
  <!-- ======================================================================================= projects and backups -->
  <section class="view" id="v-proj" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vProj"></p><h1 data-t="projTitle"></h1></div>
      <div class="emuctl"><button class="btn" id="bkgo" type="button" data-t="bkNow"></button><button class="btn ghost" id="bkimport" type="button" data-t="bkImport"></button><input id="bkfile" type="file" accept=".json,application/json" hidden></div></div>
    <p class="lead" data-t="projLead"></p>
    <p class="projstat" id="projstat" role="status"></p>
    <div class="bkprog" id="bkprog" hidden><i id="bkbar"></i></div>
    <div class="card">
      <div class="viewhead" style="margin-bottom:6px"><div><h2 data-t="slotsTitle"></h2><p class="dim" id="slotshelp"></p></div><button class="btn ghost" id="slotsread" type="button" data-t="slotsRead"></button></div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="card">
      <div class="viewhead" style="margin-bottom:6px"><div><h2 data-t="bkLibTitle"></h2><p class="dim" data-t="bkLibHelp"></p></div>
        <label class="chk"><input type="checkbox" id="bkdl" checked> <span data-t="bkAlsoFile"></span></label></div>
      <div class="bklist" id="bklist"></div>
    </div>
  </section>

  <!-- ======================================================================================= how it works -->
  <section class="view" id="v-learn" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vLearn"></p><h1 id="lrtitle"></h1></div></div>
    <p class="lead" id="lrintro"></p>
    <nav class="lrsec" id="lrsec" aria-label="sectors"></nav>
    <p class="dim lrlead" id="lrlead"></p>
    <div class="lrindex" id="lrindex" hidden></div>
    <div class="lrlive" id="lrlive" hidden>
      <div class="row"><button class="btn" type="button" id="lvgo"></button><span class="dim small" id="lvstat" role="status" aria-live="polite"></span></div>
      <div class="lvbody">
        <article class="card lvcard" id="lvcard" hidden>
          <p class="lvline" id="lvline"></p>
          <h2 id="lvtitle"></h2>
          <div class="lvval" id="lvval"><div class="lvmeter"><i id="lvbar"></i></div><b id="lvvaltext"></b></div>
          <p class="lrstate" id="lvwhat"></p>
          <p class="lvhow" id="lvhow"></p>
          <div class="lrstage" id="lvstage" hidden><canvas id="lvcanvas" aria-hidden="true"></canvas></div>
          <a class="btn ghost" id="lvmore" hidden></a>
        </article>
        <ol class="lvlog" id="lvlog"></ol>
      </div>
    </div>
    <div class="lrbody">
      <div class="lritems" id="lritems" role="listbox"></div>
      <article class="card lrcard" id="lrcard" aria-live="polite">
        <div class="lrstage"><canvas id="lrcanvas" aria-hidden="true"></canvas></div>
        <div class="lrhead"><h2 id="lrname"></h2><span class="lrtag" id="lrtag"></span></div>
        <p class="lrstate" id="lrstate"></p>
        <ul class="lrhow" id="lrhow"></ul>
        <p class="lrwhere" id="lrwhere"></p>
        <div class="row lrnav"><button class="btn ghost" type="button" id="lrback" data-t="lrIndex"></button><button class="btn ghost" type="button" id="lrprev">←</button><span class="dim small" id="lrpos"></span><button class="btn ghost" type="button" id="lrnext">→</button>
          <button class="btn ghost" type="button" data-go="emu" data-t="lrTry"></button></div>
      </article>
    </div>
  </section>

  <!-- ======================================================================================= rescue (FM-1 Rescue) -->
  <section class="view" id="v-rescue" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vRescue"></p><h1 data-t="rsTitle"></h1></div>
      <span class="badge warn" data-t="rsBeta"></span></div>
    <p class="lead" data-t="rsLead"></p>
    <div class="card rsfirst"><b data-t="rsFirstT"></b><p data-t="rsFirst"></p><button class="btn ghost" type="button" data-go="install" data-t="rsToInstall"></button></div>
    <ol class="rsteps" id="rsteps">
      <li class="card rstep" data-k="need"><h2><span class="num">1</span><span data-t="rs1"></span></h2>
        <ul class="need"><li data-t="rsNeedBoard"></li><li data-t="rsNeedUsb"></li><li data-t="rsNeedWires"></li><li data-t="rsNeedBatt"></li><li data-t="rsNeedPc"></li></ul></li>
      <li class="card rstep" data-k="board"><h2><span class="num">2</span><span data-t="rs2"></span></h2>
        <div class="seg" id="rsboard" role="radiogroup">
          <button type="button" data-board="zero">RP2040-Zero</button><button type="button" data-board="xiao">XIAO RP2040</button><button type="button" data-board="pico">Raspberry Pi Pico</button></div>
        <div class="wiring"><div id="rswire" class="wire"></div><div><p id="rswiretext"></p><p class="dim" data-t="rsCable"></p></div></div></li>
      <li class="card rstep" data-k="fw"><h2><span class="num">3</span><span data-t="rs3"></span></h2>
        <div class="seg" id="rsfw" role="radiogroup">
          <button type="button" data-fwsrc="fm">JIANT FM</button><button type="button" data-fwsrc="byte">JIANT BYTE</button><button type="button" data-fwsrc="file" data-t="rsFwFile"></button></div>
        <input type="file" id="rsfile" accept=".fwsc" hidden>
        <p class="dim" data-t="rsFwHelp"></p><p class="rsst" id="rsfwst"></p><p class="rsst" id="rsldst"></p></li>
      <li class="card rstep" data-k="make"><h2><span class="num">4</span><span data-t="rs4"></span></h2>
        <p class="dim" data-t="rsMakeHelp"></p><button class="btn" type="button" id="rsmake" data-t="rsMake"></button><p class="rsst" id="rsmakest"></p></li>
      <li class="card rstep" data-k="flash"><h2><span class="num">5</span><span data-t="rs5"></span></h2><ol class="sub" id="rsflash"></ol></li>
      <li class="card rstep" data-k="go"><h2><span class="num">6</span><span data-t="rs6"></span></h2><ol class="sub" id="rsgo"></ol>
        <h3 data-t="rsLedT"></h3><div class="leds" id="rsleds"></div></li>
      <li class="card rstep" data-k="after"><h2><span class="num">7</span><span data-t="rs7"></span></h2><p data-t="rsAfter"></p>
        <button class="btn ghost" type="button" data-go="install" data-t="rsToInstall"></button></li>
    </ol>
    <div class="card"><h2 data-t="rsAndroidT"></h2><p data-t="rsAndroid"></p>
      <div class="row"><a class="btn ghost" target="_blank" rel="noopener" href="https://github.com/juanjiant-bit/JIANT/blob/main/android/rescue/LEEME.md" data-t="rsAndroidHow"></a>
        <a class="btn ghost" target="_blank" rel="noopener" href="https://github.com/juanjiant-bit/JIANT/actions/workflows/android.yml" data-t="rsAndroidApk"></a>
        <a class="btn ghost" target="_blank" rel="noopener" href="https://github.com/juanjiant-bit/JIANT/blob/main/rescue/README.md" data-t="rsMore"></a></div></div>
    <p class="dim small" data-t="rsSafe"></p>
  </section>

  <!-- ======================================================================================= manuals -->
  <section class="view" id="v-docs" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vDocs"></p><h1 id="docstitle"></h1></div></div>
    <p class="lead" id="docslead"></p>
    <div class="docs" id="doclist"></div>
    <div class="card devtry" id="mantry" hidden>
      <div class="viewhead" style="margin-bottom:10px"><h2 id="mantrytitle"></h2><div class="emuctl"><a class="btn ghost" id="mannew" target="_blank" rel="noopener" data-t="docNewTab"></a><button class="btn ghost" id="manclose" type="button" data-t="scrExitFull"></button></div></div>
      <div class="framebox"><iframe id="f-manual" title="Manual"></iframe></div>
    </div>
  </section>

  <section class="view" id="v-ports" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vPorts"></p><h1 data-t="portsTitle"></h1></div>
      <div class="emuctl"><a class="btn" href="../docs/guide/manual.html" target="_blank" rel="noopener" data-t="portsManuals"></a><a class="btn ghost" href="../docs/guide/ports.html" target="_blank" rel="noopener" data-t="portsHow"></a></div></div>
    <p class="lead" data-t="portsLead"></p>
    <div class="ports" id="portlist"></div>
    <div class="card devtry" id="devtry" hidden>
      <div class="viewhead" style="margin-bottom:10px"><h2 id="devtrytitle"></h2><button class="btn ghost" id="devtryclose" data-t="scrExitFull"></button></div>
      <div class="framebox"><iframe id="f-devices" title="Devices" allow="autoplay; midi; fullscreen"></iframe></div>
    </div>
  </section>

  <dialog class="shotdlg" id="shotdlg" aria-labelledby="shotcap">
    <img id="shotimg" alt="">
    <div class="shotbar"><button class="btn ghost" id="shotprev" type="button" aria-label="←">←</button><p id="shotcap"></p>
      <button class="btn ghost" id="shotnext" type="button" aria-label="→">→</button><button class="btn" id="shotclose" type="button" data-t="scrExitFull"></button></div>
  </dialog>

  <!-- ======================================================================================= emulator -->
  <section class="view" id="v-emu" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vEmu"></p><h1 id="emutitle"></h1></div><div class="emuctl"><label class="field" style="min-width:240px"><span data-t="emuMidi"></span><select id="emumidi"></select></label><button class="btn" id="emufull" type="button" data-t="scrFull"></button></div></div>
    <div class="framebox" id="emubox"><button class="btn emuexit" id="emuexit" type="button" data-t="scrExitFull"></button><iframe id="f-emu" title="Emulator" loading="lazy" allow="autoplay; midi; fullscreen"></iframe></div>
  </section>

  <!-- ======================================================================================= record -->
  <section class="view" id="v-rec" hidden>
    <div class="viewhead"><div><p class="eyebrow" data-t="vRec"></p><h1 data-t="recTitle"></h1></div></div>
    <div class="card recsrc">
      <div class="srcgrid">
        <label class="field"><span data-t="recProfile"></span><select id="recprof">
          <option value="auto" data-t="profAuto"></option><option value="master" data-t="profMaster"></option>
          <option value="stems" data-t="profStems"></option><option value="stemsin" data-t="profStemsIn"></option></select></label>
        <label class="field"><span data-t="recInput"></span><select id="recdev"></select></label>
      </div>
      <p class="small dim" id="profhelp"></p>
      <div class="transport">
        <button class="btn ghost" id="recmon" data-t="recMonitor"></button>
        <button class="btn" id="recgo" data-t="recStart"></button>
        <span class="clock" id="recclock">00:00</span>
        <button class="btn ghost" id="recplay" data-t="recPlay" disabled></button>
        <span class="stat" id="recstat" role="status" aria-live="polite"></span>
      </div>
      <p class="note" id="recwarn" hidden></p>
      <div class="daw" id="daw"><p class="small dim" data-t="recDawEmpty"></p></div>
    </div>
    <div class="grid2" style="margin-top:14px">
      <div class="card">
        <h2 data-t="recMidi"></h2>
        <p class="small dim" data-t="recMidiHelp"></p>
        <label class="field"><span data-t="recMidiIn"></span><select id="midisrc"></select></label>
        <p class="stat" id="midistat"></p>
      </div>
      <div class="card">
        <h2 data-t="recStems"></h2>
        <p class="small dim" data-t="recStemsHelp"></p>
        <label class="field"><span data-t="stWhat"></span><select id="stsong">
          <option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option>
          <option value="4">5</option><option value="5">6</option><option value="live" data-t="stLive"></option></select></label>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="stgo" data-t="stGo"></button>
          <label class="btn ghost"><span data-t="stFile"></span><input type="file" id="stfile" accept=".json,application/json" hidden></label>
        </div>
        <p class="stat" id="ststat" role="status" aria-live="polite"></p>
      </div>
    </div>
    <h2 style="margin-top:22px" data-t="recTakes"></h2>
    <div class="takes" id="takes"><p class="small dim" data-t="recNone"></p></div>
  </section>
</main>
<footer><span data-t="foot"></span> · <a href="../">JIANT FM</a> (<a href="https://github.com/juanjiant-bit/JIANT">GitHub</a>) · <a href="../../JIANT-BYTE/">JIANT BYTE</a> (<a href="https://github.com/juanjiant-bit/JIANT-BYTE">GitHub</a>) · GPL-3.0</footer>

</body>
