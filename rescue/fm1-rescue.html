<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM-1 Rescue</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--mut:#6f6e69;--card:#fff;--line:#e2e0da;--acc:#ff7a00;--ok:#2e8b57;--err:#c0392b;--code:#efede7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--fg:#ecebe6;--mut:#9a9993;--card:#1c1c1a;--line:#2d2d2a;--ok:#5cc08a;--err:#e5736a;--code:#262623}}
:root[data-theme="dark"]{--bg:#121211;--fg:#ecebe6;--mut:#9a9993;--card:#1c1c1a;--line:#2d2d2a;--ok:#5cc08a;--err:#e5736a;--code:#262623}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 16px 64px}
main{max-width:620px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0 0 8px}
.lang button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 8px;font:inherit;font-size:13px;cursor:pointer}
.lang button.on{border-color:var(--acc);color:var(--acc)}
.lead{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
label.opt small{display:block;color:var(--mut)}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.s{background:none;color:var(--fg);border:1px solid var(--line);font-weight:400}
input[type=file]{display:none}
.st{margin-top:8px;font-size:14px;color:var(--mut);word-break:break-word}
.st.ok{color:var(--ok)}.st.err{color:var(--err)}
ol{padding-left:22px;margin:8px 0}li{margin:4px 0}
code{background:var(--code);border-radius:4px;padding:0 4px;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.foot{color:var(--mut);font-size:13px;margin-top:24px}
a{color:var(--acc)}
</style>
</head>

<main>
<header><h1>FM-1 Rescue</h1><div class="lang"><button data-l="es">ES</button> <button data-l="en">EN</button></div></header>
<p class="lead" data-t="lead"></p>

<section class="card">
<h2><span class="n">1</span><span data-t="s1"></span></h2>
<label class="opt"><input type="radio" name="board" value="zero" checked><span><b>Waveshare RP2040-Zero</b><small data-t="zero"></small></span></label>
<label class="opt"><input type="radio" name="board" value="xiao"><span><b>Seeed XIAO RP2040</b><small data-t="xiao"></small></span></label>
<label class="opt"><input type="radio" name="board" value="pico"><span><b>Raspberry Pi Pico</b><small data-t="pico"></small></span></label>
</section>

<section class="card">
<h2><span class="n">2</span><span data-t="s2"></span></h2>
<p class="st" data-t="s2m" style="margin-top:0"></p>
<label class="btn s"><span data-t="pick"></span><input type="file" id="fwsc" accept=".fwsc"></label>
<p class="st" data-t="s2j"></p>
<div class="st" id="fwscSt"></div>
</section>

<section class="card">
<h2><span class="n">3</span><span data-t="s3"></span></h2>
<p class="st" data-t="s3m" style="margin-top:0"></p>
<div class="st" id="ldrSt"></div>
<label class="btn s" id="ldrPick" hidden><span data-t="pickl"></span><input type="file" id="ldr" accept=".bin"></label>
</section>

<section class="card">
<h2><span class="n">4</span><span data-t="s4"></span></h2>
<button class="btn" id="make" disabled data-t="make"></button>
<div class="st" id="makeSt"></div>
</section>

<section class="card">
<h2><span class="n">5</span><span data-t="s5"></span></h2>
<ol id="steps"></ol>
</section>

<section class="card">
<h2 data-t="led"></h2>
<table id="leds"></table>
</section>

<p class="foot" data-t="foot"></p>
</main>

<script type="module">
// SPDX-License-Identifier: MIT
// FM-1 Rescue builder: turns the official FM-1.fwsc (V15) and JieLi's
// wl82loader.bin into ONE .uf2 for an RP2040 board. The .uf2 holds the rescue
// firmware (rescue/firmware, a fork of Leo Kuroshita's FM-1 Transporter) and,
// 1 MiB into the board's flash, the payload it restores by itself
// (rescue/firmware/src/payload.h). Runs in the browser and in Node (tests).
//
// The .fwsc parsing is a port of fm1_unbrick.py (Quixotic7/MvaveFM1Unbricker,
// MIT): parse_fwsc, ufw_flash and the V15 region hash.

const FW_START = 0x4000;
const FW_LEN = 0x8f000;
const FW_END = FW_START + FW_LEN;
const V15_REGION_SHA256 = "6edf3c37fb5bbbc33607c89375ee024d5477c17914d72221c8c68e58a8255686";
const LOADER_LEN = 24064;
const LOADER_SHA256 = "d41da6126760c9d66660bcc0cac8d27d221806c5e369a8036921efe68dca5376";
const LOADER_URL =
  "https://raw.githubusercontent.com/kagaimiq/jl-uboot-tool/adb3f18889e88ac512ce0a3c4d8cc3d3cb30696a/data/loaderblobs/usb/wl82loader.bin";

// payload.h
const PL_FLASH = 0x10100000;    // XIP address of the payload (1 MiB into the flash)
const PL_MAGIC = "FM1-RESCUE-PL-1";
const PL_LOADER_OFF = 0x1000;
const PL_IMAGE_OFF = 0x8000;

const FWSC_BLOCK = 0x2f, FWSC_MARKED_BLOCKS = 20, FWSC_NO_CHAR = 0x7d;

const UF2_MAGIC0 = 0x0a324655, UF2_MAGIC1 = 0x9e5d5157, UF2_MAGIC_END = 0x0ab16f30;
const UF2_FLAG_FAMILY = 0x00002000;
const RP2040_FAMILY = 0xe48bff56;

//--------------------------------------------------------------------+
// checksums
//--------------------------------------------------------------------+

const CRC_T = new Uint32Array(256).map((_, i) => {
  let c = i;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});

function crc32(d, crc = 0) {
  let c = ~crc >>> 0;
  for (let i = 0; i < d.length; i++) c = CRC_T[(c ^ d[i]) & 255] ^ (c >>> 8);
  return ~c >>> 0;
}

function crc16(d, c = 0) {
  for (let i = 0; i < d.length; i++) {
    c ^= d[i] << 8;
    for (let k = 0; k < 8; k++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
  }
  return c;
}

async function sha256hex(data) {
  const subtle = globalThis.crypto && globalThis.crypto.subtle;
  if (!subtle) throw new Error("this browser has no WebCrypto (open the page over https or as a local file)");
  const h = new Uint8Array(await subtle.digest("SHA-256", data));
  return Array.from(h, b => b.toString(16).padStart(2, "0")).join("");
}

//--------------------------------------------------------------------+
// .fwsc -> FM-1 flash region 0x4000..0x92FFF
//--------------------------------------------------------------------+

function jlEnc(buf) {
  const out = Uint8Array.from(buf);
  let k = 0xffff;
  for (let i = 0; i < out.length; i++) {
    out[i] ^= k & 0xff;
    k = ((k << 1) ^ (k & 0x8000 ? 0x1021 : 0)) & 0xffff;
  }
  return out;
}

const u16 = (p, o) => p[o] | (p[o + 1] << 8);
const u32 = (p, o) => (u16(p, o) | (u16(p, o + 2) << 16)) >>> 0;

function parseFwsc(data) {
  const stride = FWSC_BLOCK + 1;
  if (data.length < stride * FWSC_MARKED_BLOCKS) throw new Error("not an FM-1 .fwsc package (too short)");
  const head = stride * FWSC_MARKED_BLOCKS;
  const image = new Uint8Array(FWSC_BLOCK * FWSC_MARKED_BLOCKS + data.length - head);
  let identity = "";
  for (let i = 0; i < FWSC_MARKED_BLOCKS; i++) {
    image.set(data.subarray(i * stride, i * stride + FWSC_BLOCK), i * FWSC_BLOCK);
    const m = data[i * stride + FWSC_BLOCK];
    if (m !== FWSC_NO_CHAR) identity += String.fromCharCode((m - i - 1) & 0xff);
  }
  image.set(data.subarray(head), FWSC_BLOCK * FWSC_MARKED_BLOCKS);

  if (image.length < 0x400) throw new Error("not a UFW package");
  const hdr = jlEnc(image.subarray(0, 0x40));
  if (crc16(hdr.subarray(2, 0x40)) !== u16(hdr, 0)) throw new Error("not an FM-1 .fwsc (UFW header CRC)");
  const nent = u16(hdr, 8);
  if (nent === 0 || nent > 11) throw new Error("UFW header lists " + nent + " entries");
  if (crc16(image.subarray(0x40, 0x40 + nent * 0x50)) !== u16(hdr, 2)) throw new Error("UFW entry list CRC: damaged package");
  let fl = null;
  for (let i = 0; i < nent; i++) {
    const e = jlEnc(image.subarray(0x40 + i * 0x50, 0x90 + i * 0x50));
    if (u16(e, 0) === 0) fl = [u32(e, 8), u32(e, 12)];
  }
  if (!fl) throw new Error("no flash.bin in the package");
  const [off, len] = fl;
  if (off + len > image.length) throw new Error("flash.bin runs past the package");
  if (len < FW_END) throw new Error("flash.bin is too short: not a complete FM-1 package");
  const flash = image.subarray(off, off + len);
  return { identity, region: flash.slice(FW_START, FW_END), flashLen: len };
}

// The V15 package, checked by the hash of its firmware region.
async function checkV15(fwscBytes) {
  const { identity, region } = parseFwsc(fwscBytes);
  const sha = await sha256hex(region);
  if (sha !== V15_REGION_SHA256) {
    throw new Error(
      `this is not the official V15 (identity ${identity || "none"}, region sha256 ${sha.slice(0, 16)}…). ` +
      "Only the official M-VAVE V15 FM-1.fwsc (699,956 bytes) is accepted.");
  }
  return { identity, region, sha };
}

const LOADER_MARK = new TextEncoder().encode("FELUCCA-LOADER-1");
function hasMark(d) {
  outer: for (let i = 0; i + LOADER_MARK.length <= d.length; i++) {
    for (let k = 0; k < LOADER_MARK.length; k++) if (d[i + k] !== LOADER_MARK[k]) continue outer;
    return true;
  }
  return false;
}

// The official V15 (by its region hash), or a JIANT / Felucca-family package made by tools/fm1pkg_make.py:
// identity FM-1_9xx, flash.bin exactly 0x93000, Felucca's own loader in it. JIANT runs under the boot head of
// V15 and of V16, so it is the one for an FM-1 that came with V16. Same rules as RescueImage.checkFirmware.
async function checkPackage(fwscBytes) {
  const { identity, region, flashLen } = parseFwsc(fwscBytes);
  const sha = await sha256hex(region);
  if (sha === V15_REGION_SHA256) return { identity, region, sha, official: true, label: `${identity || "FM-1_015"} official V15` };
  if (identity === "FM-1_015") throw new Error("it says V15 but its firmware hash is not V15's: damaged or modified");
  if (!/^FM-1_9\d\d$/.test(identity))
    throw new Error(`not the official V15 nor a JIANT package (identity ${identity || "none"}); the official V16 does not fit the rescue`);
  if (flashLen !== FW_END) throw new Error("this package runs past 0x92FFF; the rescue cannot write it");
  if (!hasMark(fwscBytes)) throw new Error("not a package made by JIANT's tools");
  if (region.every(b => b === 0xff || b === 0)) throw new Error("the firmware region of this package is blank");
  return { identity, region, sha, official: false, label: `${identity} JIANT` };
}

async function checkLoader(bytes) {
  if (bytes.length !== LOADER_LEN) throw new Error(`wl82loader.bin must be ${LOADER_LEN} bytes, not ${bytes.length}`);
  const sha = await sha256hex(bytes);
  if (sha !== LOADER_SHA256) throw new Error("wl82loader.bin has the wrong sha256 " + sha.slice(0, 16) + "…");
  return bytes;
}

//--------------------------------------------------------------------+
// payload + UF2
//--------------------------------------------------------------------+

function hexToBytes(h) {
  return Uint8Array.from(h.match(/../g), x => parseInt(x, 16));
}

function buildPayload(region, loader, sha, label) {
  const p = new Uint8Array(PL_IMAGE_OFF + FW_LEN).fill(0xff);
  const h = new Uint8Array(256);
  const dv = new DataView(h.buffer);
  for (let i = 0; i < PL_MAGIC.length; i++) h[i] = PL_MAGIC.charCodeAt(i);
  const w = (o, v) => dv.setUint32(o, v >>> 0, true);
  w(16, 1);                 // version
  w(20, 256);               // hdr_size
  w(24, PL_LOADER_OFF);
  w(28, LOADER_LEN);
  w(32, crc32(loader));
  w(36, PL_IMAGE_OFF);
  w(40, FW_START);
  w(44, FW_LEN);
  w(48, crc32(region));
  const lab = label.slice(0, 63);
  for (let i = 0; i < lab.length; i++) h[52 + i] = lab.charCodeAt(i) & 0x7f;
  h.set(hexToBytes(sha), 116);
  w(252, crc32(h.subarray(0, 252)));
  p.set(h, 0);
  p.set(loader, PL_LOADER_OFF);
  p.set(region, PL_IMAGE_OFF);
  return p;
}

function parseUf2(uf2) {
  if (uf2.length % 512) throw new Error("base .uf2 is not a whole number of blocks");
  const blocks = [];
  for (let o = 0; o < uf2.length; o += 512) {
    const b = uf2.subarray(o, o + 512);
    const dv = new DataView(b.buffer, b.byteOffset, 512);
    if (dv.getUint32(0, true) !== UF2_MAGIC0 || dv.getUint32(4, true) !== UF2_MAGIC1 ||
        dv.getUint32(508, true) !== UF2_MAGIC_END) throw new Error("base .uf2: bad block magic");
    blocks.push({
      flags: dv.getUint32(8, true), addr: dv.getUint32(12, true), size: dv.getUint32(16, true),
      family: dv.getUint32(28, true), data: b.slice(32, 32 + dv.getUint32(16, true)),
    });
  }
  return blocks;
}

function emitUf2(blocks) {
  const out = new Uint8Array(blocks.length * 512);
  blocks.forEach((bl, i) => {
    const b = out.subarray(i * 512, i * 512 + 512);
    const dv = new DataView(out.buffer, i * 512, 512);
    dv.setUint32(0, UF2_MAGIC0, true);
    dv.setUint32(4, UF2_MAGIC1, true);
    dv.setUint32(8, bl.flags, true);
    dv.setUint32(12, bl.addr, true);
    dv.setUint32(16, bl.data.length, true);
    dv.setUint32(20, i, true);
    dv.setUint32(24, blocks.length, true);
    dv.setUint32(28, bl.family, true);
    b.set(bl.data, 32);
    dv.setUint32(508, UF2_MAGIC_END, true);
  });
  return out;
}

// base firmware .uf2 + payload -> one .uf2 the RP2040 boot ROM takes in one copy.
function mergeUf2(baseUf2, payload) {
  const base = parseUf2(baseUf2);
  let end = 0;
  for (const b of base) {
    if (b.family !== RP2040_FAMILY || !(b.flags & UF2_FLAG_FAMILY)) throw new Error("base .uf2 is not an RP2040 image");
    if (b.addr < 0x10000000) throw new Error("base .uf2 writes outside the flash");
    end = Math.max(end, b.addr + b.size);
  }
  if (end > PL_FLASH) throw new Error("base firmware overlaps the payload area");
  const blocks = base.map(b => ({ ...b }));
  // Header page, loader, image: pages of 256 bytes. The 0xFF gap between the
  // loader and the image is not sent (its sectors are erased by the boot ROM
  // or never read).
  const ranges = [[0, 256], [PL_LOADER_OFF, PL_LOADER_OFF + LOADER_LEN],
                  [PL_IMAGE_OFF, PL_IMAGE_OFF + FW_LEN]];
  for (const [lo, hi] of ranges) {
    for (let o = lo; o < hi; o += 256) {
      const data = new Uint8Array(256).fill(0xff);
      data.set(payload.subarray(o, Math.min(o + 256, hi)));
      blocks.push({ flags: UF2_FLAG_FAMILY, addr: PL_FLASH + o, size: 256, family: RP2040_FAMILY, data });
    }
  }
  return emitUf2(blocks);
}

async function buildRescueUf2({ baseUf2, fwsc, loader, label }) {
  const v = await checkPackage(fwsc);
  await checkLoader(loader);
  const payload = buildPayload(v.region, loader, v.sha, label || v.label);
  return { uf2: mergeUf2(baseUf2, payload), identity: v.identity, official: v.official };
}

es: {
lead: "Repara un FM-1 que no enciende (hard brick) con un RP2040 y nada más: sin Python, sin terminal. Esta página crea un archivo .uf2 que lleva dentro el firmware oficial V15; lo copias al RP2040 y él solo restaura el FM-1, conectado a un PC o a un simple cargador USB.",
s1: "Tu placa", zero: "La de la guía de GoodPerson42. Cables: verde → 0, blanco → 1, negro → GND.",
xiao: "Cables: verde → D6, blanco → D7, negro → GND.",
pico: "Y placas tipo Pico, como la Ultimate Pico RP2040 morada (pines 0, 1 y G junto al USB-C). Cables: verde → GP0 (pin 1), blanco → GP1 (pin 2), negro → GND (pin 3). Su LED es de un color: parpadeo lento = esperando, parpadeo rápido = error, fijo = listo.",
s2: "Firmware: JIANT o V15 oficial", s2m: "Un paquete de JIANT (.fwsc, el del instalador) o el FM-1.fwsc de la V15 oficial de M-VAVE (699.956 bytes). Se comprueban: cualquier otro se rechaza (la V16 no cabe). No sale de tu navegador.",
s2j: "Si tu FM-1 venía con la V16, usa JIANT: funciona con el arranque de la V16; con la V15 no está comprobado.",
pick: "Elegir .fwsc",
s3: "Loader de JieLi", s3m: "wl82loader.bin, de jl-uboot-tool (kagaimiq, MIT). Se descarga solo de GitHub y se comprueba su hash.",
pickl: "Elegir wl82loader.bin",
s4: "Crear el archivo", make: "Crear fm1-rescue.uf2",
s5: "Usarlo",
steps: [
"Mantén pulsado <b>BOOT</b> en el RP2040 y conéctalo al PC. Aparece una unidad <code>RPI-RP2</code>.",
"Arrastra <code>fm1-rescue.uf2</code> a esa unidad. Se cierra sola cuando termina.",
"Desconecta el RP2040. Con el FM-1 <b>apagado</b>, conecta los tres cables (rojo sin conectar) y enchufa el USB-C al FM-1.",
"Conecta el RP2040 a un PC o a un cargador USB. El LED parpadea en <b>amarillo</b>.",
"<b>Enciende el FM-1.</b> El LED se pone azul mientras trabaja (1–3 minutos).",
"<b>Verde fijo</b> = listo. Apaga el FM-1, quita los cables y vuelve a encenderlo: arranca con el firmware elegido. Luego puedes cambiarlo con el instalador de JIANT.",

foot: "Solo se escribe la zona del firmware (0x4000–0x92FFF), sector a sector, cada uno verificado; la cabecera de arranque y tus datos (ajustes, sonidos, canciones) no se tocan. Sin la V15 dentro, la placa funciona como un FM-1 Transporter normal. Basado en FM-1 Transporter (Leo Kuroshita, MIT), MvaveFM1Unbricker (Quixotic7, MIT) y jl-uboot-tool (kagaimiq, MIT). Herramienta no oficial: úsala bajo tu responsabilidad, con la batería cargada.",

en: {
lead: "Fix an FM-1 that does not turn on (hard brick) with an RP2040 and nothing else: no Python, no terminal. This page makes a .uf2 file that carries the official V15 firmware; copy it to the RP2040 and it restores the FM-1 by itself, plugged into a computer or a plain USB charger.",
s1: "Your board", zero: "The one in GoodPerson42's guide. Wires: green → 0, white → 1, black → GND.",
xiao: "Wires: green → D6, white → D7, black → GND.",
pico: "And Pico-style boards such as the purple Ultimate Pico RP2040 (pins 0, 1 and G next to the USB-C). Wires: green → GP0 (pin 1), white → GP1 (pin 2), black → GND (pin 3). Its LED has one colour: slow blink = waiting, fast blink = error, steady = done.",
s2: "Firmware: JIANT or official V15", s2m: "A JIANT package (.fwsc, the installer's) or M-VAVE's official V15 FM-1.fwsc (699,956 bytes). Both are checked: anything else is refused (V16 does not fit). It never leaves your browser.",
s2j: "If your FM-1 came with V16, use JIANT: it runs with V16's boot head; V15 is not tested with it.",
pick: "Choose .fwsc",
s3: "JieLi loader", s3m: "wl82loader.bin from jl-uboot-tool (kagaimiq, MIT). Downloaded from GitHub automatically and hash-checked.",
pickl: "Choose wl82loader.bin",
s4: "Make the file", make: "Make fm1-rescue.uf2",
s5: "Use it",
steps: [
"Hold <b>BOOT</b> on the RP2040 and plug it into the computer. An <code>RPI-RP2</code> drive appears.",
"Drag <code>fm1-rescue.uf2</code> onto that drive. It closes by itself when done.",
"Unplug the RP2040. With the FM-1 <b>off</b>, connect the three wires (red stays unconnected) and plug the USB-C into the FM-1.",
"Plug the RP2040 into a computer or a USB charger. The LED blinks <b>yellow</b>.",
"<b>Switch the FM-1 on.</b> The LED turns blue while it works (1–3 minutes).",
"<b>Steady green</b> = done. Switch the FM-1 off, remove the wires, switch it on: it boots the chosen firmware. You can change it later with the JIANT installer.",

foot: "Only the firmware area (0x4000–0x92FFF) is written, sector by sector, each one verified; the boot head and your data (settings, sounds, songs) are not touched. Without V15 inside, the board works as a plain FM-1 Transporter. Built on FM-1 Transporter (Leo Kuroshita, MIT), MvaveFM1Unbricker (Quixotic7, MIT) and jl-uboot-tool (kagaimiq, MIT). Unofficial tool: use it at your own risk, on a charged battery.",

const $ = id => document.getElementById(id);
let lang = (navigator.language || "").startsWith("es") ? "es" : "en";
try { lang = localStorage.getItem("fm1r-lang") || lang; } catch (e) {}
let fwsc = null, loader = null, v15 = null;
const status = {};

function say(id, key, cls = "", extra = "") {
  status[id] = [key, cls, extra];
  const e = $(id);
  e.textContent = (key ? T[lang][key] : "") + extra;
  e.className = "st " + cls;
}
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T[lang][e.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  $("steps").innerHTML = T[lang].steps.map(s => `<li>${s}</li>`).join("");
  $("leds").innerHTML = T[lang].leds.map(([c, a, b]) =>
    `<tr><td style="white-space:nowrap"><span class="dot" style="background:${c}"></span>${a}</td><td>${b}</td></tr>`).join("");
  for (const id in status) say(id, ...status[id]);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  try { localStorage.setItem("fm1r-lang", lang); } catch (e) {}
  render();
});
const ready = () => { $("make").disabled = !(v15 && loader); };

$("fwsc").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  fwsc = null; v15 = null; ready();
  try {
    fwsc = new Uint8Array(await f.arrayBuffer());
    v15 = await checkPackage(fwsc);
    say("fwscSt", "ok15", "ok", `${v15.official ? "V15" : "JIANT"} (${f.name}, ${v15.identity})`);
  } catch (err) { say("fwscSt", "fail", "err", err.message); }
  ready();
};
async function useLoader(bytes) {
  loader = await checkLoader(bytes);
  say("ldrSt", "ldrok", "ok");
  $("ldrPick").hidden = true;
  ready();
}
$("ldr").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { await useLoader(new Uint8Array(await f.arrayBuffer())); }
  catch (err) { say("ldrSt", "fail", "err", err.message); }
};
(async () => {
  try {
    const r = await fetch(LOADER_URL);
    if (!r.ok) throw new Error("HTTP " + r.status);
    await useLoader(new Uint8Array(await r.arrayBuffer()));
  } catch (err) {
    say("ldrSt", "ldrfail", "err");
    $("ldrPick").hidden = false;
  }
})();

$("make").onclick = async () => {
  try {
    const board = document.querySelector("input[name=board]:checked").value;
    const baseUf2 = Uint8Array.from(atob(BASE[board]), c => c.charCodeAt(0));
    const { uf2 } = await buildRescueUf2({ baseUf2, fwsc, loader });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([uf2], { type: "application/octet-stream" }));
    a.download = "fm1-rescue.uf2";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    say("makeSt", "made", "ok", ` (${BOARD_NAME[board]}, ${(uf2.length / 1024).toFixed(0)} KB)`);
  } catch (err) { say("makeSt", "fail", "err", err.message); }
};
render();
</script>
</body>
</html>
