plugins {
    id "com.android.application"
}
android {
    namespace "fm.jiant.rescue"
    compileSdk 34
    defaultConfig {
        applicationId "fm.jiant.rescue"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }
    signingConfigs {
        debug {                        // (one key for every build: a new APK installs over the last one)
            storeFile file("rescue-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    sourceSets {
        // The rescue firmware for each board, from rescue/base (rescue/build.sh).
        // assets-jiant: the public JIANT package (fetch_jiant.py, run by the android workflow; not in git).
        main { assets.srcDirs += ["../../../rescue/base", "src/main/assets-jiant"] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
