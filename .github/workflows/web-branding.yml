name: JIANT tool branding
on:
  push:
    branches: [codex/web-branding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build real installer/editor pages with existing firmware
        run: |
          mkdir -p build
          curl --fail --location --retry 2 --max-time 60 'https://juanjiant-bit.github.io/JIANT/firmware/felucca-v0.9.9-par12-527c7e4.fwsc' -o build/brand.fwsc
          python3 web/make_site.py build/brand.fwsc v0.9.9-par12-527c7e4 build/branding-site
      - name: Browser driver
        run: pip install --timeout 30 --retries 2 playwright==1.58.0
      - name: Chromium
        timeout-minutes: 5
        run: command -v google-chrome || python3 -m playwright install chromium
      - name: Phone and desktop rendering, navigation and screenshots
        timeout-minutes: 4
        run: timeout 180s python3 -u tests/browser_branding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jiant-tool-screenshots
          path: build/branding-screenshots/
          if-no-files-found: warn
