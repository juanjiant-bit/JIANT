name: Publish installer pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/installer-pages.yml
      - tools/patch_installer_downloads.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download current published site
        id: site
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 43203399564
          github-token: ${{ github.token }}
          path: build/released
      - name: Published site to start from (the artifact; the live site when it expired or is older)
        # The Pages artifact of the pinned run expires; the live site does not. tools/fetch_live_site.py leaves at
        # build/released/artifact.tar the downloaded artifact, or the live site fetched file by file and checked
        # (site-manifest.json, SHA256SUMS, versions.json); it stops the run rather than start from a partial site.
        run: |
          [ "${{ steps.site.outcome }}" = success ] || rm -rf build/released
          python3 tools/fetch_live_site.py restore --artifact build/released/artifact.tar
      - name: Update only the two installer pages
        run: |
          mkdir -p build/pages
          tar -xf build/released/artifact.tar -C build/pages
          python3 tools/patch_installer_downloads.py build/pages
      - name: Site manifest (every file with its SHA-256, for the next publish to recover the site exactly)
        run: python3 tools/fetch_live_site.py manifest build/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
          retention-days: 90   # (the default is 1 day: the next publish starts from this artifact)
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
