# SPDX-License-Identifier: GPL-3.0-only
# JIANT beyond the FM-1, published: the ports' builds (ports.yml, the same jobs) attached to a GitHub pre-release
# tagged ports-<ports/RELEASE_VERSION>, its text ports/RELEASE.md. Runs when ports/RELEASE_VERSION changes on main,
# or by hand; a tag already released is left as it is. The SMK-37 packages are not attached (not tried on hardware).
name: ports release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ports/RELEASE_VERSION"]
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "v=$(tr -d ' \n' < ports/RELEASE_VERSION)" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/ports.yml
    with:
      release_version: ${{ needs.version.outputs.v }}
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.v }}
        run: |
          TAG="ports-$V"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          mkdir -p up
          find dist -name '*.zip' -exec cp {} up/ \;
          for f in up/JIANT-FM-Linux.zip up/JIANT-FM-Windows.zip; do
            [ -f "$f" ] && mv "$f" "${f%.zip}-$V.zip"
          done
          ls -l up
          gh release create "$TAG" up/*.zip --target "$GITHUB_SHA" --prerelease \
            --title "JIANT FM beyond the FM-1 — $V (preview)" --notes-file ports/RELEASE.md
