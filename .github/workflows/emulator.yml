# SPDX-License-Identifier: GPL-3.0-only
# The browser emulator (web/emu) on GitHub Pages: the firmware's sources compiled to WebAssembly, on every push to
# main. Needs Settings > Pages > Source: "GitHub Actions" once. No JieLi toolchain: only the generated headers.
name: emulator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow numpy fonttools
      - name: generated headers (fonts, icons, palettes, shapes, tables, samples)
        run: python3 -c "import sys; sys.path.insert(0, 'tools'); import build; build.generate()"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11                # (the version the emulator is tested with)
      - name: the emulator
        run: sh web/emu/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/emu
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
